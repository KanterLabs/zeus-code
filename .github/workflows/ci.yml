name: Verify v1

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: homelab
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '${{ matrix.python }}'
      - name: Validate source and lifecycle
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests scripts
          python -m unittest discover -s tests -v
          git diff --check
      - name: Build and smoke-test standalone release
        run: |
          python scripts/build.py
          python dist/zeus-code.pyz --version
          python scripts/smoke.py --executable dist/zeus-code.pyz

  npm-test:
    runs-on: homelab
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '18'
      - name: Verify npm launcher, publisher and installed lifecycle
        run: |
          mkdir -p .work/tmp
          export TMPDIR="$PWD/.work/tmp"
          npm test
          python scripts/smoke-npm.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, npm-test]
    runs-on: homelab
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build deterministic release assets
        run: python scripts/build.py
      - name: Publish verified GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_release.py

  npm-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    # npm OIDC does not support self-hosted runners. Only this job needs
    # the GitHub-hosted exception; tests and GitHub releases use homelab.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.19.1
      - name: Build release metadata
        run: python scripts/build.py
      - name: Publish matching public npm release with OIDC
        run: node scripts/publish-npm.cjs
