name: Verify v1

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: homelab
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '${{ matrix.python }}'
      - name: Validate source and lifecycle
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests scripts
          python -m unittest discover -s tests -v
          git diff --check
      - name: Build and smoke-test standalone release
        run: |
          python scripts/build.py
          python dist/zeus-code.pyz --version
          python scripts/smoke.py --executable dist/zeus-code.pyz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: homelab
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build deterministic release assets
        run: python scripts/build.py
      - name: Publish verified GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_release.py
